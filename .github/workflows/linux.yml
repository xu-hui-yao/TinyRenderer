name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Install CMake and Build Tools
        run: sudo apt-get install -y cmake build-essential
      - name: Configure and Build
        run: |
          # M_ENABLE_GPU=OFF: the GPU backend requires the Vulkan SDK and slangc,
          # neither of which is preinstalled on GitHub runners (and there is no
          # GPU to run it on). Remove this flag in a job that installs them.
          cmake -DCMAKE_BUILD_TYPE=Release -DM_ENABLE_GPU=OFF -S . -B build
          cd build
          make -j$(nproc)
