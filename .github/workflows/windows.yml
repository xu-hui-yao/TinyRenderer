name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Install CMake
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
      - name: Configure and Build
        run: |
          # M_ENABLE_GPU=OFF: the GPU backend requires the Vulkan SDK and slangc,
          # which the Windows image does not reliably provide (and there is no
          # GPU to run it on). Remove this flag in a job that installs them.
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -DM_ENABLE_GPU=OFF
          cmake --build . --config Release
